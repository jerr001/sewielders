<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Sewielders</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      body {
        background: #f3f5f4;
      }
      .admin-shell {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 20px 40px;
      }
      .admin-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
      }
      .admin-grid {
        display: grid;
        grid-template-columns: 250px 1fr;
        gap: 20px;
      }
      .sidebar {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1rem;
      }
      .sidebar nav {
        display: grid;
        gap: 0.5rem;
      }
      .sidebar a {
        padding: 0.9rem 1rem;
        border-radius: 12px;
        color: var(--text);
        font-weight: 600;
      }
      .sidebar a:hover {
        background: rgba(28,167,184,0.08);
      }
      .content {
        display: grid;
        gap: 1.5rem;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem;
      }
      .stat-card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 1.2rem;
      }
      .stat-number {
        font-size: 2rem;
        font-weight: 800;
        color: var(--accent-strong);
      }
      @media (max-width: 820px) {
        .admin-grid,
        .stats-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <div class="admin-topbar">
        <div class="brand">
          <span class="brand-mark">S</span>
          <span class="brand-name"><strong>SEWIELDERS</strong></span>
        </div>
        <a class="ghost-btn" href="login.html">Logout</a>
      </div>

      <div class="admin-grid">
        <aside class="sidebar">
          <nav aria-label="Admin navigation">
            <a href="dashboard.html">Dashboard</a>
            <a href="#">Blog</a>
            <a href="#">Gallery</a>
            <a href="#">Settings</a>
          </nav>
        </aside>

        <main class="content">
          <section class="stats-grid">
            <article class="stat-card">
              <div class="stat-number">18</div>
              <div>Total Blog Posts</div>
            </article>
            <article class="stat-card">
              <div class="stat-number">11</div>
              <div>Published</div>
            </article>
            <article class="stat-card">
              <div class="stat-number">7</div>
              <div>Drafts</div>
            </article>
            <article class="stat-card">
              <div class="stat-number">42</div>
              <div>Gallery Photos</div>
            </article>
          </section>

          <section class="card">
            <h2>Recent posts</h2>
            <ul class="info-list">
              <li>Helping older adults live with dignity</li>
              <li>Why companionship matters in aging</li>
              <li>Designing care around the human being</li>
            </ul>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
